services:
  mongodb:
    image: mongo:7
    container_name: bankapi-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  bankapi:
    build: .
    container_name: bankapi
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/bankapi
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
